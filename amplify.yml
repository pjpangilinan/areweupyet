version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Compile Go Lambda binaries for Amazon Linux 2023
        - mkdir -p dist/dispatcher dist/api-private dist/api-public dist/notifier
        - env GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o dist/dispatcher/bootstrap ./cmd/dispatcher
        - env GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o dist/api-private/bootstrap ./cmd/api-private
        - env GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o dist/api-public/bootstrap ./cmd/api-public
        - env GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o dist/notifier/bootstrap ./cmd/notifier
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - cd frontend && npm ci && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - frontend/node_modules/**/*
