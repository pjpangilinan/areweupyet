version: 1
backend:
  phases:
    build:
      commands:
        # Install Go 1.22 in user home directory and set user GOPATH/GOCACHE
        - |
          export GOPATH=$HOME/go
          export GOCACHE=$HOME/.cache/go-build
          mkdir -p $HOME/go $HOME/.cache/go-build $HOME/.go
          if [ ! -f $HOME/.go/bin/go ]; then
            echo "Installing Go 1.22.6 for Lambda cross-compilation..."
            curl -sL https://go.dev/dl/go1.22.6.linux-amd64.tar.gz -o /tmp/go.tar.gz
            tar -C $HOME/.go --strip-components=1 -xzf /tmp/go.tar.gz
            rm -f /tmp/go.tar.gz
          fi
          env GOPATH=$HOME/go GOCACHE=$HOME/.cache/go-build $HOME/.go/bin/go version
        - npm ci --cache .npm --prefer-offline
        # Compile Go Lambda binaries for Amazon Linux 2023
        - mkdir -p dist/dispatcher dist/api-private dist/api-public dist/notifier
        - env GOPATH=$HOME/go GOCACHE=$HOME/.cache/go-build GOOS=linux GOARCH=amd64 $HOME/.go/bin/go build -tags lambda.norpc -o dist/dispatcher/bootstrap ./cmd/dispatcher
        - env GOPATH=$HOME/go GOCACHE=$HOME/.cache/go-build GOOS=linux GOARCH=amd64 $HOME/.go/bin/go build -tags lambda.norpc -o dist/api-private/bootstrap ./cmd/api-private
        - env GOPATH=$HOME/go GOCACHE=$HOME/.cache/go-build GOOS=linux GOARCH=amd64 $HOME/.go/bin/go build -tags lambda.norpc -o dist/api-public/bootstrap ./cmd/api-public
        - env GOPATH=$HOME/go GOCACHE=$HOME/.cache/go-build GOOS=linux GOARCH=amd64 $HOME/.go/bin/go build -tags lambda.norpc -o dist/notifier/bootstrap ./cmd/notifier
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - cd frontend && npm ci && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - frontend/node_modules/**/*
      - $HOME/.go/**/*
      - $HOME/go/**/*
