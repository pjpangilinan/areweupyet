name: CI Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Build Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Run Go Unit Tests
        run: go test -v ./internal/... ./cmd/...

      - name: Verify Go Lambda Cross-Compilation
        run: |
          mkdir -p dist/dispatcher dist/api-private dist/api-public dist/notifier
          GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o dist/dispatcher/bootstrap ./cmd/dispatcher
          GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o dist/api-private/bootstrap ./cmd/api-private
          GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o dist/api-public/bootstrap ./cmd/api-public
          GOOS=linux GOARCH=amd64 go build -tags lambda.norpc -o dist/notifier/bootstrap ./cmd/notifier

      - name: Verify Amplify CDK Typecheck
        run: npx tsc --noEmit -p amplify/tsconfig.json

      - name: Verify Frontend Production Build
        run: npm run build:frontend
